<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AVITOLOG · Avito OAuth Callback</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111a;
      --card: #0d1d2a;
      --line: #1d9bd1;
      --text: #e9fbff;
      --muted: #9db9c7;
      --ok: #20e6a4;
      --warn: #ffc857;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(26, 193, 255, 0.18), transparent 36rem),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(620px, 100%);
      border: 1px solid rgba(29, 155, 209, 0.55);
      border-radius: 22px;
      background: rgba(13, 29, 42, 0.86);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      padding: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -0.04em;
      color: #63f6ff;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.55;
    }

    .status {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid rgba(32, 230, 164, 0.55);
      border-radius: 14px;
      color: var(--ok);
      background: rgba(32, 230, 164, 0.08);
      font-weight: 700;
    }

    .hint {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(255, 200, 87, 0.42);
      border-radius: 14px;
      color: var(--warn);
      background: rgba(255, 200, 87, 0.08);
      font-size: 14px;
    }

    code {
      color: #ffffff;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>AVITOLOG</h1>
    <p>Техническая страница возврата после авторизации Авито.</p>
    <p>Эта страница не открывает CRM, не подключает Supabase, не читает Google Drive и не показывает данные клиентов.</p>
    <div class="status" id="status">Callback готов.</div>
    <div class="hint" id="hint" hidden></div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var status = document.getElementById('status');
      var hint = document.getElementById('hint');
      var code = params.get('code');
      var error = params.get('error');

      if (error) {
        status.textContent = 'Авито вернул ошибку авторизации.';
        status.style.borderColor = 'rgba(255, 94, 94, 0.7)';
        status.style.color = '#ff8f8f';
        status.style.background = 'rgba(255, 94, 94, 0.08)';
        hint.hidden = false;
        hint.innerHTML = 'Ошибка: <code></code>';
        hint.querySelector('code').textContent = error;
        return;
      }

      if (code) {
        status.textContent = 'Авторизация Авито вернулась успешно. Код получен.';
        hint.hidden = false;
        hint.textContent = 'Следующий шаг: backend обменяет этот временный код на токены Авито. На этой странице данные не сохраняются.';
      }
    })();
  </script>
</body>
</html>
