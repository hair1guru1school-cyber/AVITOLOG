<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Восстановление базы проектов</title>
<style>
  body { font-family: sans-serif; background: #0d1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px 40px; max-width: 480px; text-align: center; }
  h2 { margin: 0 0 12px; color: #58a6ff; }
  p { color: #8b949e; font-size: 14px; line-height: 1.6; }
  .clients { text-align: left; background: #0d1117; border-radius: 8px; padding: 12px 16px; margin: 16px 0; font-size: 13px; }
  .clients div { padding: 3px 0; }
  button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 10px 28px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #2ea043; }
  .warn { color: #f78166; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
  <h2>🗂 Восстановление базы проектов</h2>
  <p>Будет обновлён <strong>только</strong> один ключ:<br><code>avitolog_assets_base_v2_sasha</code><br>Касса, цели, клиенты CRM и всё остальное — <strong>не тронуто</strong>.</p>
  <div class="clients" id="list"></div>
  <button onclick="doRestore()">Восстановить базу</button>
  <div class="warn">⚠ Файл нужно открыть из той же папки, что и index.html</div>
</div>

<script>
var BASE_KEY = 'avitolog_assets_base_v2_sasha';

var BASE_DATA = [
  {"emoji":"📦","name":"Новый проект","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🪨","name":"Камни и Пеллеты","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🛌","name":"Кирилл Кровати","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🏠","name":"Дмитрий Бани Каркасные","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🚜","name":"СельхозТехника","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"👩🏻‍🏫","name":"Ксения Сергеевна","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"⚡️","name":"Электрик Крым Александр","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🧱","name":"Иван Сияр Сендвич","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🧱","name":"Дома Андрей","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"⚡","name":"Автосервис Илья","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🛠️","name":"Олег Бурение скважин","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🎯","name":"Печать на футболках и тд","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🛻","name":"Логистика","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""},
  {"emoji":"🪑","name":"Рушан Корпусная мебель","paid":"","expected":"","paymentDate":"","startDate":"","clientType":"new","folderLink":""}
];

// Show list
var listEl = document.getElementById('list');
BASE_DATA.forEach(function(c) {
  var d = document.createElement('div');
  d.textContent = c.emoji + ' ' + c.name;
  listEl.appendChild(d);
});

function doRestore() {
  try {
    localStorage.setItem(BASE_KEY, JSON.stringify(BASE_DATA));
    alert('Готово! База проектов восстановлена (' + BASE_DATA.length + ' клиентов).\nВсё остальное не тронуто.\n\nНажми OK — откроется главная страница.');
    window.location.href = 'index.html';
  } catch(e) {
    alert('Ошибка: ' + e.message);
  }
}
</script>
</body>
</html>
