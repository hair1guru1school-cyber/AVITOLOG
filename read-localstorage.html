<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AVITOLOG — Чтение localStorage</title>
<style>
body{background:#0f1115;color:#ccc;font-family:monospace;padding:24px;font-size:13px}
h2{color:#35d0ff}
pre{background:#161a1f;border:1px solid #2a2e35;border-radius:8px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto}
.ok{color:#00d97e}.err{color:#ff6b6b}.warn{color:#ffa500}
button{background:linear-gradient(135deg,#35d0ff,#7c6af7);color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:700;margin:8px 4px}
</style>
</head>
<body>
<h2>🔍 Читаем localStorage на hair1guru1school-cyber.github.io</h2>
<p style="color:#888">Нажми кнопку — скрипт попытается прочитать все ключи CRM/целей из localStorage этого домена.</p>
<button onclick="readGoals()">📊 Прочитать данные целей</button>
<button onclick="downloadAll()">💾 Скачать все ключи (JSON)</button>
<div id="out"></div>
<script>
function readGoals() {
  var out = document.getElementById('out');
  try {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf('avitolog_goals') === 0 || k.indexOf('avitolog_assets') === 0)) {
        keys.push(k);
      }
    }
    keys.sort();
    var html = '<h3 class="ok">Найдено ' + keys.length + ' ключей:</h3>';
    keys.forEach(function(k) {
      var v = localStorage.getItem(k) || '';
      var parsed;
      try { parsed = JSON.parse(v); } catch(e) { parsed = null; }
      var projectCount = (parsed && Array.isArray(parsed.projects)) ? parsed.projects.length :
                         (parsed && Array.isArray(parsed)) ? parsed.length : '?';
      var preview = v.substring(0, 200);
      html += '<div style="margin:12px 0"><b style="color:#35d0ff">' + k + '</b> <span style="color:#888">(проектов/записей: ' + projectCount + ')</span><pre>' + escHtml(preview) + '...</pre></div>';
    });
    out.innerHTML = html;
  } catch(e) {
    out.innerHTML = '<p class="err">Ошибка: ' + e.message + '</p>';
  }
}
function downloadAll() {
  var data = {};
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && (k.indexOf('avitolog') === 0 || k.indexOf('crm_') === 0)) {
      data[k] = localStorage.getItem(k);
    }
  }
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'avitolog-localstorage-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
}
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
