# Деплой на GitHub Pages. cancel-in-progress: false — новый пуш не отменяет текущую сборку.
# Если в репо есть старый "pages build and deployment", отключи его: Actions → выбери workflow → ... → Disable.
name: Deploy to Pages
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude '.tmp.driveupload' \
            --exclude 'node_modules' \
            --exclude 'backend' \
            --exclude 'backups'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
